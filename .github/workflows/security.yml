name: security

# Free, private-repo-friendly security scanning (no GitHub Advanced Security /
# CodeQL required). Results are printed in the job logs; jobs fail on real
# findings (secrets, HIGH/CRITICAL vulns). Semgrep runs non-blocking until its
# findings are triaged, then flip continue-on-error to false.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly baseline scan

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # scan full history
      - name: Run gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --redact --exit-code 1 --config .gitleaks.toml

  deps:
    name: trivy (dependency + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install trivy
        run: curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1
      - name: Scan filesystem (lockfiles + secrets)
        run: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  sast:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    continue-on-error: true      # informational until findings are triaged
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep scan
        run: semgrep scan --config p/owasp-top-ten --config p/javascript --config p/nodejsscan --config p/secrets --error --skip-unknown-extensions
