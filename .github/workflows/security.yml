name: security

# Free, private-repo-friendly security scanning (no GitHub Advanced Security /
# CodeQL required). Results are printed in the job logs.
#   - gitleaks: fails on committed secrets.
#   - trivy: fails on HIGH/CRITICAL dependency vulns.
#   - semgrep: reports SAST findings (informational; add --error to enforce once
#     the current findings are triaged).

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly baseline scan

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks (working tree)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          # Scan the current tree (what actually ships). On any finding, print the
          # (redacted) report so the rule/file is visible in the log, then fail.
          ./gitleaks detect --no-git --redact --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json \
          || { echo '=== gitleaks findings ==='; cat gitleaks-report.json; exit 1; }

  deps:
    name: trivy (dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run trivy
        run: |
          set -euo pipefail
          # Official installer picks the correct latest asset; install to a
          # writable dir (RUNNER_TEMP) to avoid the /usr/local/bin permission issue.
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  sast:
    name: semgrep (SAST, blocking)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        # BLOCKING (--error): a new SAST finding fails the build. The existing
        # findings were triaged; a small set of rules is excluded here with a
        # documented rationale (accepted risk / verified false positive), so
        # every OTHER rule is enforced:
        #   raw-html-format ....... server-side transactional EMAIL html only;
        #        every interpolation is escapeHtml()'d and there is no browser
        #        DOM sink in the API — no XSS vector.
        #   request-host-used ..... nginx is the single-domain TLS edge; $host in
        #        the http→https redirect and Host pass-through is the intended
        #        pattern (the API sets `trust proxy` for exactly one hop).
        #   github-actions-mutable-action-tag / gha-curl-pipe-shell .. first-party
        #        actions/* at major tags and the official Trivy installer over
        #        HTTPS; full SHA-pinning is tracked as a separate supply-chain task.
        # The one path-join finding (admin.js backup download) is suppressed
        # inline where it is proven safe (basename + strict allowlist).
        run: >-
          semgrep scan --error
          --config p/owasp-top-ten --config p/javascript --config p/secrets
          --skip-unknown-extensions
          --exclude-rule javascript.express.security.injection.raw-html-format.raw-html-format
          --exclude-rule generic.nginx.security.request-host-used.request-host-used
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --exclude-rule yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell

  compliance:
    name: compliance catalogue (controls-as-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate controls catalogue + coverage freshness
        # Fails if controls.json is malformed, references an unknown framework/risk,
        # cites an evidence path that no longer exists, or COVERAGE.md is stale.
        run: node compliance/report.mjs --check
