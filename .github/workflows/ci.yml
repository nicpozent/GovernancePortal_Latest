name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — test + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web — build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # Vite 8 requires Node >=20.19 / >=22.12
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build SPA
        run: npm run build
      - name: Audit production dependencies
        # The shipped artifact is the static build served by nginx, so gate on
        # the production dependency tree.
        run: npm audit --omit=dev --audit-level=high
