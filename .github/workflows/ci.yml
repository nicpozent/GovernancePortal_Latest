name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — test + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SUPER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/governance
      DATABASE_URL: postgres://governance_app:apppw@localhost:5432/governance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests (unit + DB + API against Postgres)
        run: npm run test:all
      - name: Coverage gate (lines>=70, branches>=60, functions>=65)
        run: npm run test:coverage:gate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web — build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # Vite 8 requires Node >=20.19 / >=22.12
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Build SPA
        run: npm run build
      - name: Audit production dependencies
        # The shipped artifact is the static build served by nginx, so gate on
        # the production dependency tree.
        run: npm audit --omit=dev --audit-level=high
