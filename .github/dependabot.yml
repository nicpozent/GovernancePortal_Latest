version: 2
updates:
  # API dependencies
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Wait 7 days before proposing a newly published version — a freshly
    # published (or newly compromised) package has not had time to be caught.
    cooldown:
      default-days: 7
    groups:
      api-minor-patch:
        update-types: ["minor", "patch"]

  # Web (SPA) dependencies
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
