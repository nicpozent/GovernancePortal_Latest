<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Birgma Governance Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:#eef1f5;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased;color:#1a1d29}
input,select,button{font-family:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#d2d7e3;border-radius:7px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b9c0d2;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes cardUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes drawerIn{from{transform:translateX(40px);opacity:.4}to{transform:translateX(0);opacity:1}}
</style>
<!-- runtime config (regenerated from env by the container at startup; see 40-envconfig.sh).
     A classic script runs before the deferred module below, so window.APP_CONFIG is set in time. -->
<script src="/config.js"></script>
</head>
<body>
<div id="root"></div>
<!-- Vite injects the hashed, pre-built bundle here at build time. No CDN, no in-browser Babel. -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
