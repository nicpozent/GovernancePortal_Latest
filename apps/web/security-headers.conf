# ── Security response headers (shared include) ──────────────────────────────
# nginx's add_header inheritance is REPLACE-on-redefine: any location that sets
# its own add_header (e.g. Cache-Control on the SPA shell / config.js / static)
# silently drops every header inherited from the server block. To avoid shipping
# the app shell without CSP/HSTS/framing protection, this list lives in one file
# and is `include`d at server scope AND inside each of those locations.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP: self-hosted bundle (Vite) — no CDN script sources, no 'unsafe-eval'.
# 'unsafe-inline' kept for styles (inline style objects + the index.html <style>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-src 'self' blob: https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
