# ── HTTP :80 — redirect everything to HTTPS ─────────────────
server {
  listen 80;
  server_name _;
  # ACME http-01 challenge files (only used if you get certs via Let's Encrypt/win-acme)
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
  # Container liveness — served locally on :80 (no TLS, no API dependency, no redirect)
  # so the Docker HEALTHCHECK can check nginx itself.
  location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 — the app ────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Certs are MOUNTED at runtime (see docker-compose web.volumes) — never baked into the image.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  # Allow large training uploads (PPTX/video) — must exceed the API's 250MB cap headroom.
  client_max_body_size 300m;

  # ── Security headers ──────────────────────────────────────
  # Shared include (see security-headers.conf). Re-included in every location
  # below that sets its own add_header, because nginx drops inherited headers
  # from any block that defines one of its own.
  include /etc/nginx/snippets/security-headers.conf;

  root /usr/share/nginx/html;
  index index.html;

  # Don't cache the app shell or runtime config (so redeploys + env changes take effect).
  # Vite's hashed /static/* bundles are content-addressed, so they can cache forever.
  # Each of these re-includes the security headers (an add_header here would
  # otherwise strip the server-level ones from these responses).
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }
  location ~* ^/static/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Reverse-proxy the API so the browser calls the SAME origin → no CORS needed.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /healthz { proxy_pass http://api:8080/healthz; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
