# ── HTTP :80 — redirect everything to HTTPS ─────────────────
server {
  listen 80;
  server_name _;
  # ACME http-01 challenge files (only used if you get certs via Let's Encrypt/win-acme)
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
  # Container liveness — served locally on :80 (no TLS, no API dependency, no redirect)
  # so the Docker HEALTHCHECK can check nginx itself.
  location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 — the app ────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Certs are MOUNTED at runtime (see docker-compose web.volumes) — never baked into the image.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  # Allow large training uploads (PPTX/video) — must exceed the API's 250MB cap headroom.
  client_max_body_size 300m;

  # ── Security headers ──────────────────────────────────────
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP: self-hosted bundle (Vite) means no CDN script sources and no 'unsafe-eval'.
  # 'unsafe-inline' for script is needed only for the tiny inline config bootstrap; we
  # load config.js as a file, so script-src stays 'self'. 'unsafe-inline' kept for styles
  # (the SPA uses inline style objects) and for the inline <style> block in index.html.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  # Don't cache the app shell or runtime config (so redeploys + env changes take effect).
  # Vite's hashed /assets/* bundles are content-addressed, so they can cache forever.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /config.js  { add_header Cache-Control "no-store"; }
  location ~* ^/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Reverse-proxy the API so the browser calls the SAME origin → no CORS needed.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /healthz { proxy_pass http://api:8080/healthz; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
