# Fluent Bit — collects the stack's container logs (shipped via the Docker
# fluentd driver, see docker-compose.logging.yml) and forwards them to a SIEM.
# Env vars are substituted at runtime (${VAR}); set them in deploy/.env.
[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Receives log events from the Docker fluentd logging driver.
[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# The fluentd driver delivers each stdout line as {"log":"<line>", ...}.
# The API/DB emit structured JSON (pino), so parse that JSON out of "log"
# to get first-class fields (level, msg, user, req.id, statusCode, ...).
[FILTER]
    Name         parser
    Match        gov.*
    Key_Name     log
    Parser       pino_json
    Reserve_Data On

# ── Destination: Microsoft Sentinel / Azure Log Analytics ───────────────────
# Classic Data Collector API (Workspace ID + primary key). For the newer
# DCR-based ingestion use the `azure_logs_ingestion` output instead.
[OUTPUT]
    Name        azure
    Match       gov.*
    Customer_ID ${LA_WORKSPACE_ID}
    Shared_Key  ${LA_SHARED_KEY}
    Log_Type    GovernancePortal

# ── Alternatives (uncomment one instead of the azure block above) ───────────
# [OUTPUT]
#     Name        splunk
#     Match       gov.*
