# ── Birgma Governance — local/container stack ───────────────
# Run from this deploy/ folder:  docker compose up --build -d
# Build contexts live in ../apps; certs/backups/uploads are local to deploy/.
# Copy ../.env.example -> .env (here) and set the passwords first.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    # Resource guardrails (honored by `docker compose up`) to bound blast radius
    # of a runaway query / resource-exhaustion DoS. Tune to your host.
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/api/db/docker-init-role.sh:/docker-entrypoint-initdb.d/010-role.sh:ro
      - ../apps/api/db/schema.sql:/docker-entrypoint-initdb.d/020-schema.sql:ro
      - ../apps/api/db/migration_002_groups.sql:/docker-entrypoint-initdb.d/030-groups.sql:ro
      - ../apps/api/db/migration_003_group_mapping.sql:/docker-entrypoint-initdb.d/040-mapping.sql:ro
      - ../apps/api/db/migration_004_archive.sql:/docker-entrypoint-initdb.d/050-archive.sql:ro
      - ../apps/api/db/migration_005_map_any_group.sql:/docker-entrypoint-initdb.d/060-mapany.sql:ro
      - ../apps/api/db/migration_006_audit.sql:/docker-entrypoint-initdb.d/070-audit.sql:ro
      - ../apps/api/db/migration_007_group_archive.sql:/docker-entrypoint-initdb.d/080-grouparchive.sql:ro
      - ../apps/api/db/migration_008_managers.sql:/docker-entrypoint-initdb.d/090-managers.sql:ro
      - ../apps/api/db/migration_009_due_date.sql:/docker-entrypoint-initdb.d/100-duedate.sql:ro
      - ../apps/api/db/migration_010_due_days.sql:/docker-entrypoint-initdb.d/110-duedays.sql:ro
      - ../apps/api/db/migration_011_quizzes.sql:/docker-entrypoint-initdb.d/120-quizzes.sql:ro
      - ../apps/api/db/migration_012_quiz_archive.sql:/docker-entrypoint-initdb.d/130-quizarchive.sql:ro
      - ../apps/api/db/migration_013_notifications.sql:/docker-entrypoint-initdb.d/140-notifications.sql:ro
      - ../apps/api/db/migration_014_review_history.sql:/docker-entrypoint-initdb.d/150-reviewhistory.sql:ro
      - ../apps/api/db/migration_015_owner_user.sql:/docker-entrypoint-initdb.d/160-owneruser.sql:ro
      - ../apps/api/db/migration_016_trainings.sql:/docker-entrypoint-initdb.d/170-trainings.sql:ro
      - ../apps/api/db/migration_017_integrations.sql:/docker-entrypoint-initdb.d/180-integrations.sql:ro
      - ../apps/api/db/migration_018_effective_membership.sql:/docker-entrypoint-initdb.d/190-effmembers.sql:ro
      - ../apps/api/db/migration_019_approvals.sql:/docker-entrypoint-initdb.d/195-approvals.sql:ro
      - ../apps/api/db/migration_020_approval_steps.sql:/docker-entrypoint-initdb.d/196-approval-steps.sql:ro
      - ../apps/api/db/migration_021_approval_templates.sql:/docker-entrypoint-initdb.d/197-approval-templates.sql:ro
      - ../apps/api/db/migration_022_group_approvers.sql:/docker-entrypoint-initdb.d/198-group-approvers.sql:ro
      - ../apps/api/db/migration_023_ledger_fk_restrict.sql:/docker-entrypoint-initdb.d/199-ledger-fk.sql:ro
      - ../apps/api/db/docker-grants.sql:/docker-entrypoint-initdb.d/900-grants.sql:ro
    # Loopback-only publish: DB not exposed on the VM network. Remove for prod.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d governance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 256
    env_file:
      - ../apps/api/.env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://governance_app:${APP_DB_PASSWORD}@db:5432/governance
      PGSSL: ""
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads
    # Loopback-only publish: the API is NOT exposed on the VM/host network — the
    # browser reaches it only through the nginx TLS edge (web → http://api:8080 on
    # the compose network). This keeps plaintext HTTP off external interfaces and
    # stops a direct client spoofing X-Forwarded-For past `trust proxy`.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../apps/web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 128
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      SPA_CLIENT_ID: ${SPA_CLIENT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      API_BASE: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
